name: Daily Ebook Automation

on:
  schedule:
    # Runs at 9:00 AM Asia/Kolkata (3:30 UTC) daily
    - cron: '30 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-automation:
    name: Run Daily Ebook Automation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BOOK_PDF_GEMINI_MODEL: ${{ secrets.BOOK_PDF_GEMINI_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Invoke Daily Ebook Automation Edge Function
        id: automation
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/daily-ebook-automation")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "result=$BODY" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Automation failed with HTTP $HTTP_CODE"
            echo "error=$BODY" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Log Result
        if: always()
        run: |
          if [ "${{ steps.automation.outcome }}" == "success" ]; then
            echo "✅ Daily ebook automation completed successfully"
            echo "${{ steps.automation.outputs.result }}" | jq .
          else
            echo "❌ Daily ebook automation failed"
            echo "${{ steps.automation.outputs.error }}" | jq .
          fi

      - name: Create Summary
        if: always()
        run: |
          if [ "${{ steps.automation.outcome }}" == "success" ]; then
            RESULT="${{ steps.automation.outputs.result }}"
            RUN_ID=$(echo "$RESULT" | jq -r '.run_id // "unknown"')
            INSERTED=$(echo "$RESULT" | jq -r '.summary.inserted // 0')
            ENRICHED=$(echo "$RESULT" | jq -r '.summary.authors_enriched // 0')
            ERRORS=$(echo "$RESULT" | jq -r '.summary.errors // 0')

            cat >> $GITHUB_STEP_SUMMARY <<EOF
            # Daily Ebook Automation Run

            **Run ID:** \`$RUN_ID\`
            **Status:** ✅ Success
            **Books Inserted:** $INSERTED
            **Authors Enriched:** $ENRICHED
            **Errors:** $ERRORS
            **Triggered:** $(date -u +"%Y-%m-%d %H:%M UTC") (9:00 AM IST)
            EOF
          else
            cat >> $GITHUB_STEP_SUMMARY <<EOF
            # Daily Ebook Automation Run

            **Status:** ❌ Failed
            **Error:** ${{ steps.automation.outputs.error }}
            **Triggered:** $(date -u +"%Y-%m-%d %H:%M UTC") (9:00 AM IST)
            EOF
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          # Optional: Add Slack/Discord/Email notification here
          echo "Automation failed - check workflow logs"