name: SonarCloud analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'himanshugupta30062_Sahadhyayi' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SONAR_TOKEN."
            exit 1
          fi
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::Missing repository Actions variable SONAR_ORGANIZATION. Set it to the exact organization key shown in SonarQube Cloud."
            exit 1
          fi
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::error::Missing repository Actions variable SONAR_PROJECT_KEY."
            exit 1
          fi
          if [ "$SONAR_HOST_URL" != "https://sonarcloud.io" ]; then
            echo "::error::SONAR_HOST_URL must be https://sonarcloud.io for SonarQube Cloud."
            exit 1
          fi

      - name: Set up Node.js for coverage
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The coverage provider is a separate Vitest package. Keep its version aligned
      # with the Vitest 1.6.1 version resolved in package-lock.json without changing
      # the lockfile from this workflow.
      - name: Install matching Vitest coverage provider
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @vitest/coverage-v8@1.6.1

      - name: Run tests and generate LCOV coverage
        id: coverage_tests
        # Preserve the test failure outcome so Sonar can still receive the generated
        # coverage report. A final step below keeps the Analysis job failed if any
        # tests fail; this is not a green waiver.
        continue-on-error: true
        # Use an intentionally unreachable local Supabase endpoint for unit tests;
        # never use production credentials for coverage runs.
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: test-public-anon-key
        run: npx vitest run --coverage.enabled=true --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=./coverage

      - name: Verify LCOV report exists
        id: verify_lcov
        if: always()
        run: |
          echo "Coverage output directory contents:"
          if [ -d coverage ]; then find coverage -maxdepth 2 -type f -printf '%p (%s bytes)\n'; else echo 'coverage directory missing'; fi
          if [ ! -s coverage/lcov.info ]; then echo '::error::Vitest did not emit coverage/lcov.info; inspect coverage provider output above.'; exit 1; fi

      - name: Analyze with SonarQube Cloud
        if: always() && steps.verify_lcov.outcome == 'success'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'himanshugupta30062_Sahadhyayi' }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.tests=src/__tests__
            -Dsonar.verbose=true

      - name: Keep test failures visible
        if: always() && steps.coverage_tests.outcome == 'failure'
        run: |
          echo "::error::The Vitest suite failed. Review the test output before merging; Sonar analysis was allowed to run only to publish coverage."
          exit 1
