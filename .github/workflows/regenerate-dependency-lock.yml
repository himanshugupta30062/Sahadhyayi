name: Regenerate dependency lockfile

on:
  push:
    branches:
      - chore/npm-deprecation-cleanup-2026-11-01
    paths:
      - package.json
      - eslint.config.js
      - .github/workflows/regenerate-dependency-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/npm-deprecation-cleanup-2026-11-01
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve updated dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --no-progress eslint@10.14.0 @eslint/js@10.0.1 @eslint/compat@2.1.1 @sentry/node@11.9.0 @sentry/react@11.9.0 eslint-plugin-react-hooks@7.1.1 eslint-plugin-react-refresh@0.5.7 globals@17.13.0 typescript-eslint@8.72.1 @typescript-eslint/eslint-plugin@8.72.1 @typescript-eslint/parser@8.72.1
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m "chore: refresh npm lockfile"
            git push origin chore/npm-deprecation-cleanup-2026-11-01
          else
            echo "Lockfile already current."
          fi
