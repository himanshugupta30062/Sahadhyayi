
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify production HTML points to compiled assets
        shell: bash
        run: |
          set -euo pipefail
          test -s ./dist/index.html
          if grep -Eq '/src/main\\.tsx|/src/index\\.css' ./dist/index.html; then
            echo "::error::Built index.html still references Vite source files instead of compiled assets."
            exit 1
          fi
          if ! grep -Eq 'src="/assets/[^"]+\\.js"' ./dist/index.html; then
            echo "::error::Built index.html does not reference a compiled JavaScript asset."
            exit 1
          fi
          while IFS= read -r asset; do
            test -s "./dist/${asset#/}" || { echo "::error::Missing compiled asset: $asset"; exit 1; }
          done < <(grep -oE '(src|href)="/assets/[^"]+' ./dist/index.html | cut -d '"' -f 2 | sort -u)
          echo "Production HTML references existing compiled assets."
      - name: Use app entry point for GitHub Pages SPA fallback
        run: cp ./dist/index.html ./dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
