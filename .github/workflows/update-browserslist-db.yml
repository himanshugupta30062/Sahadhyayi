name: Refresh Browserslist database

on:
  push:
    branches:
      - chore/update-browserslist-database
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browserslist-db-refresh
  cancel-in-progress: true

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/update-browserslist-database
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install current lockfile dependencies
        run: npm ci --ignore-scripts
      - name: Refresh caniuse-lite with the official updater
        env:
          npm_config_ignore_scripts: "true"
        run: |
          # Sahadhyayi uses npm and package-lock.json. Ensure stray lockfiles do not trigger alternative package managers.
          rm -f bun.lock bun.lockb pnpm-lock.yaml yarn.lock deno.lock
          # Pin the on-demand CLI to a version already resolved in package-lock.json.
          npm install --global --ignore-scripts update-browserslist-db@1.1.1
          update-browserslist-db
      - name: Commit the lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh Browserslist compatibility database"
          git push origin HEAD:chore/update-browserslist-database
