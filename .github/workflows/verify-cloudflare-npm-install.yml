name: Verify Cloudflare npm install

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/verify-cloudflare-npm-install.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/verify-cloudflare-npm-install.yml

permissions:
  contents: read

jobs:
  clean-install:
    name: Node 22 / npm 10.9.2 clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      # Cloudflare Pages currently builds with Node 22.23.4 and npm 10.9.2.
      - name: Match Cloudflare npm version
        run: |
          npm install --global npm@10.9.2 --ignore-scripts
          node --version
          npm --version
      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
