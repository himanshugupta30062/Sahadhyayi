name: Verify Cloudflare npm installation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  cloudflare-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Match Cloudflare npm version
        run: npm install --global npm@10.9.2 --ignore-scripts
      - name: Verify npm configuration
        run: |
          node --version
          npm --version
          npm config get legacy-peer-deps
      - name: Verify clean install (same command as Cloudflare)
        run: npm clean-install --ignore-scripts --no-audit --no-fund
