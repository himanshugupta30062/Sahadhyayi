name: License Compliance CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install license checker
        run: npm install --global license-checker@^25
      - name: Check licenses
        run: license-checker --production --failOn "GPL;AGPL"
