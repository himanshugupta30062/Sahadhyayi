name: License Compliance CI
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned license checker without lifecycle scripts
        run: npm install --global --ignore-scripts license-checker@25.0.1
      - name: Check licenses
        run: license-checker --production --failOn "GPL;AGPL"
