name: Cloudflare production route smoke test

on:
  push:
    branches: ["main"]
    paths:
      - "wrangler.jsonc"
      - "scripts/check-cloudflare-routing-config.mjs"
      - ".github/workflows/cloudflare-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-diagnostics:
    name: Inspect public DNS and live origins
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report DNS, HTTP responses, and production bundle config
        env:
          EXPECTED_SUPABASE_URL: https://rknxtatvlzunatpyqxro.supabase.co
        shell: bash
        run: |
          set +e
          echo "=== Authoritative nameservers (NS) ==="
          dig +short NS sahadhyayi.com
          echo "=== Apex A / AAAA ==="
          dig +short A sahadhyayi.com
          dig +short AAAA sahadhyayi.com
          echo "=== www CNAME / A ==="
          dig +short CNAME www.sahadhyayi.com
          dig +short A www.sahadhyayi.com
          for url in https://sahadhyayi.com/ https://www.sahadhyayi.com/ https://sahadhyayi.gyan-596.workers.dev/; do
            echo "=== HTTP headers: $url ==="
            curl -sSIL --max-time 12 "$url" | head -n 25
          done
          inspect_bundle() {
            local base_url="$1"
            local html_status asset asset_url bundle_status
            html_status="$(curl -sSL --max-time 10 -o /tmp/sahadhyayi-page.html -w '%{http_code}' "${base_url%/}/" || true)"
            echo "=== Bundle inspection: $base_url (HTML HTTP $html_status) ==="
            [[ -s /tmp/sahadhyayi-page.html ]] || { echo "No HTML body"; return; }
            grep -oE 'src="[^"]+\.js[^"]*"' /tmp/sahadhyayi-page.html | cut -d '"' -f 2 | head -n 8 | while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              if [[ "$asset" == http* ]]; then asset_url="$asset"; else asset_url="${base_url%/}$asset"; fi
              bundle_status="$(curl -sSL --max-time 10 -o /tmp/sahadhyayi-bundle.js -w '%{http_code}' "$asset_url" || true)"
              if grep -Fq "$EXPECTED_SUPABASE_URL" /tmp/sahadhyayi-bundle.js 2>/dev/null; then
                echo "Asset $asset_url: HTTP $bundle_status; production Supabase URL present"
              else
                echo "Asset $asset_url: HTTP $bundle_status; production Supabase URL absent"
              fi
            done
          }
          inspect_bundle https://sahadhyayi.gyan-596.workers.dev
          inspect_bundle https://www.sahadhyayi.com

  verify-production-domain:
    name: Verify Worker and production custom domains
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Cloudflare rollout and verify production hosts
        env:
          EXPECTED_SUPABASE_URL: https://rknxtatvlzunatpyqxro.supabase.co
        shell: bash
        run: |
          set -euo pipefail

          verify_bundle() {
            local base_url="$1"
            local html js_assets asset asset_url bundle

            html="$(curl -fsSL --max-time 15 "$base_url/" || true)"
            [[ -n "$html" ]] || return 1

            js_assets="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js[^"]*"' | cut -d '"' -f 2 || true)"
            while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              if [[ "$asset" == http* ]]; then
                asset_url="$asset"
              else
                asset_url="${base_url%/}$asset"
              fi

              bundle="$(curl -fsSL --max-time 15 "$asset_url" || true)"
              if [[ "$bundle" == *"$EXPECTED_SUPABASE_URL"* ]]; then
                return 0
              fi
            done <<< "$js_assets"

            return 1
          }

          echo "Authoritative nameservers for sahadhyayi.com:"
          dig +short NS sahadhyayi.com || true
          echo "Apex A/AAAA answers:"
          dig +short A sahadhyayi.com || true
          dig +short AAAA sahadhyayi.com || true
          echo "www CNAME answer:"
          dig +short CNAME www.sahadhyayi.com || true
          echo "HTTP response headers from public apex:"
          curl -sSIL --max-time 15 https://sahadhyayi.com/ | head -n 30 || true

          worker_url="https://sahadhyayi.gyan-596.workers.dev"
          worker_ready=0

          for attempt in {1..18}; do
            if verify_bundle "$worker_url"; then
              worker_ready=1
              echo "Worker endpoint is serving the configured production bundle."
            fi

            if verify_bundle "https://sahadhyayi.com"; then
              echo "Apex custom domain serves the configured production bundle."
              if verify_bundle "https://www.sahadhyayi.com"; then
                echo "www custom domain also serves the configured production bundle."
                exit 0
              fi
              echo "::error::The apex domain is healthy, but www.sahadhyayi.com is not serving the configured application."
              exit 1
            fi

            echo "Attempt $attempt/18: Cloudflare production rollout is not yet verifiable."
            sleep 10
          done

          if [[ "$worker_ready" -eq 1 ]]; then
            echo "::error::The Worker origin is configured correctly, but the custom domain still serves a different origin. Check Custom Domain binding and conflicting DNS records."
          else
            echo "::error::Neither the Worker URL nor the custom domain serves the configured production bundle. Check the active Cloudflare deployment and build variables."
          fi
          exit 1
