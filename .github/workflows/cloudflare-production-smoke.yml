name: Cloudflare production route smoke test

on:
  push:
    branches: ["main"]
    paths:
      - "wrangler.jsonc"
      - "scripts/check-cloudflare-routing-config.mjs"
      - ".github/workflows/cloudflare-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-domain:
    name: Verify production domain serves configured application
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Cloudflare rollout and verify the live bundle
        env:
          EXPECTED_SUPABASE_URL: https://rknxtatvlzunatpyqxro.supabase.co
        shell: bash
        run: |
          set -euo pipefail

          base_url="https://sahadhyayi.com"
          for attempt in {1..18}; do
            html="$(curl -fsSL --max-time 15 "$base_url/" || true)"
            if [[ -n "$html" ]]; then
              js_assets="$(printf '%s' "$html" | grep -oE 'src="[^"]+\.js[^"]*"' | cut -d '"' -f 2 || true)"
              while IFS= read -r asset; do
                [[ -n "$asset" ]] || continue
                if [[ "$asset" == http* ]]; then
                  asset_url="$asset"
                else
                  asset_url="$base_url$asset"
                fi

                bundle="$(curl -fsSL --max-time 15 "$asset_url" || true)"
                if [[ "$bundle" == *"$EXPECTED_SUPABASE_URL"* ]]; then
                  echo "Production domain serves a bundle configured for the production Supabase project."
                  exit 0
                fi
              done <<< "$js_assets"
            fi

            echo "Attempt $attempt/18: waiting for the production route and configured bundle."
            sleep 10
          done

          echo "::error::The production domain did not serve a JavaScript bundle containing the expected Supabase project URL. Check Cloudflare domain routes/proxying and the active Worker deployment."
          exit 1
