name: Cloudflare production route smoke test

on:
  push:
    branches: ["main"]
    paths:
      - "wrangler.jsonc"
      - "scripts/check-cloudflare-routing-config.mjs"
      - ".github/workflows/cloudflare-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-diagnostics:
    name: Inspect public DNS and live origins
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report DNS, HTTP responses, and production bundle config
        env:
          EXPECTED_SUPABASE_URL: https://rknxtatvlzunatpyqxro.supabase.co
        shell: bash
        run: |
          set +e
          echo "=== Authoritative nameservers (NS) ==="
          dig +short NS sahadhyayi.com
          echo "=== Apex A / AAAA ==="
          dig +short A sahadhyayi.com
          dig +short AAAA sahadhyayi.com
          echo "=== www CNAME / A ==="
          dig +short CNAME www.sahadhyayi.com
          dig +short A www.sahadhyayi.com
          for url in https://sahadhyayi.com/ https://www.sahadhyayi.com/ https://sahadhyayi.gyan-596.workers.dev/; do
            echo "=== HTTP headers: $url ==="
            curl -sSIL --max-time 12 "$url" | head -n 25
          done
          inspect_bundle() {
            local base_url="$1"
            local effective_url html_status asset asset_url bundle_status
            effective_url="$(curl -sSL --max-time 10 -o /tmp/sahadhyayi-page.html -w '%{url_effective}' "${base_url%/}/" || true)"
            html_status="$(curl -sSL --max-time 10 -o /dev/null -w '%{http_code}' "${base_url%/}/" || true)"
            echo "=== Bundle inspection: $base_url (effective: $effective_url, HTTP $html_status) ==="
            [[ -s /tmp/sahadhyayi-page.html ]] || { echo "No HTML body"; return; }
            local origin
            origin="$(echo "$effective_url" | grep -oE "^https?://[^/]+")"
            [[ -n "$origin" ]] || origin="${base_url%/}"
            grep -oE '(src|href)="[^"]+\.js[^"]*"' /tmp/sahadhyayi-page.html | cut -d '"' -f 2 | head -n 16 | while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              if [[ "$asset" == http* ]]; then asset_url="$asset"; else asset_url="${origin%/}$asset"; fi
              bundle_status="$(curl -sSL --max-time 10 -o /tmp/sahadhyayi-bundle.js -w '%{http_code}' "$asset_url" || true)"
              if grep -Fq "$EXPECTED_SUPABASE_URL" /tmp/sahadhyayi-bundle.js 2>/dev/null; then
                echo "Asset $asset_url: HTTP $bundle_status; production Supabase URL present"
              else
                echo "Asset $asset_url: HTTP $bundle_status; production Supabase URL absent"
              fi
            done
          }
          inspect_bundle https://sahadhyayi.gyan-596.workers.dev
          inspect_bundle https://www.sahadhyayi.com

  verify-production-domain:
    name: Verify Worker and production custom domains
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Cloudflare rollout and verify matching entry bundles
        env:
          EXPECTED_SUPABASE_URL: https://rknxtatvlzunatpyqxro.supabase.co
        shell: bash
        run: |
          set -euo pipefail

          entry_path() {
            local base_url="$1"
            local effective_url origin html module_script entry_asset entry_url normalized_path status

            effective_url="$(curl -fsSL --max-time 15 -o /tmp/smoke-page.html -w "%{url_effective}" "$base_url/" || true)"
            [[ -s /tmp/smoke-page.html ]] || return 1

            html="$(cat /tmp/smoke-page.html)"
            origin="$(printf '%s' "$effective_url" | grep -oE '^https?://[^/]+' || true)"
            [[ -n "$origin" ]] || origin="${base_url%/}"

            module_script="$(printf '%s' "$html" | grep -oE '<script[^>]*>' | grep -E 'type="module"' | head -n 1 || true)"
            entry_asset="$(printf '%s' "$module_script" | grep -oE 'src="[^"]+\.js[^"]*"' | head -n 1 | cut -d '"' -f 2 || true)"
            [[ -n "$entry_asset" ]] || return 1

            case "$entry_asset" in
              http://*|https://*) entry_url="$entry_asset" ;;
              /*) entry_url="${origin%/}$entry_asset" ;;
              *) entry_url="${origin%/}/$entry_asset" ;;
            esac

            normalized_path="$(printf '%s' "$entry_asset" | sed -E 's#^https?://[^/]+##; s/[?].*$//')"
            status="$(curl -sSL --max-time 15 -o /tmp/smoke-entry.js -w "%{http_code}" "$entry_url" || true)"
            [[ "$status" == "200" ]] || return 1

            printf '%s\n' "$normalized_path"
          }

          asset_has_supabase_url() {
            local base_url="$1"
            local effective_url origin html js_assets asset asset_url bundle

            effective_url="$(curl -fsSL --max-time 15 -o /tmp/smoke-config-page.html -w "%{url_effective}" "$base_url/" || true)"
            [[ -s /tmp/smoke-config-page.html ]] || return 1
            html="$(cat /tmp/smoke-config-page.html)"
            origin="$(printf '%s' "$effective_url" | grep -oE '^https?://[^/]+' || true)"
            [[ -n "$origin" ]] || origin="${base_url%/}"

            js_assets="$(printf '%s' "$html" | grep -oE '(src|href)="[^"]+\.js[^"]*"' | cut -d '"' -f 2 || true)"
            while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              if [[ "$asset" == http* ]]; then
                asset_url="$asset"
              elif [[ "$asset" == /* ]]; then
                asset_url="${origin%/}$asset"
              else
                asset_url="${origin%/}/$asset"
              fi

              bundle="$(curl -fsSL --max-time 15 "$asset_url" || true)"
              if [[ "$bundle" == *"$EXPECTED_SUPABASE_URL"* ]]; then
                echo "Production Supabase URL found in $asset_url"
                return 0
              fi
            done <<< "$js_assets"

            return 1
          }

          echo "Authoritative nameservers for sahadhyayi.com:"
          dig +short NS sahadhyayi.com || true
          echo "Apex A/AAAA answers:"
          dig +short A sahadhyayi.com || true
          dig +short AAAA sahadhyayi.com || true
          echo "www CNAME answer:"
          dig +short CNAME www.sahadhyayi.com || true
          echo "HTTP response headers from public apex:"
          curl -sSIL --max-time 15 https://sahadhyayi.com/ | head -n 30 || true

          worker_url="https://sahadhyayi.gyan-596.workers.dev"
          worker_entry=""
          apex_entry=""
          www_entry=""

          for attempt in {1..18}; do
            worker_entry="$(entry_path "$worker_url" || true)"
            apex_entry="$(entry_path "https://sahadhyayi.com" || true)"
            www_entry="$(entry_path "https://www.sahadhyayi.com" || true)"

            echo "Attempt $attempt/18 entry bundles:"
            echo "  Worker: ${worker_entry:-MISSING}"
            echo "  Apex:   ${apex_entry:-MISSING}"
            echo "  www:    ${www_entry:-MISSING}"

            if [[ -n "$worker_entry" && "$worker_entry" == "$apex_entry" && "$worker_entry" == "$www_entry" ]]; then
              if asset_has_supabase_url "$worker_url" &&
                asset_has_supabase_url "https://sahadhyayi.com" &&
                asset_has_supabase_url "https://www.sahadhyayi.com"; then
                echo "Worker and both production domains serve the same JavaScript entry bundle and configured Supabase project."
                exit 0
              fi
              echo "Entry bundle matches, but a host has not yet exposed the production Supabase configuration."
            else
              echo "Entry bundle mismatch; waiting for the production deployment/cache to converge."
            fi

            sleep 10
          done

          echo "::error::Production hosts do not all serve the same JavaScript entry bundle with the expected Supabase configuration."
          echo "::error::Worker entry: ${worker_entry:-MISSING}"
          echo "::error::Apex entry: ${apex_entry:-MISSING}"
          echo "::error::www entry: ${www_entry:-MISSING}"
          exit 1
