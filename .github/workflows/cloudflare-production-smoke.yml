name: Cloudflare production route smoke test

on:
  push:
    branches: ["main"]
    paths:
      - "wrangler.jsonc"
      - "scripts/check-cloudflare-routing-config.mjs"
      - ".github/workflows/cloudflare-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-diagnostics:
    name: Inspect public DNS and live origins
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report DNS, HTTP responses, and production bundle config
        env:
          EXPECTED_SUPABASE_URL: https://rknxtatvlzunatpyqxro.supabase.co
        shell: bash
        run: |
          set +e
          echo "=== Authoritative nameservers (NS) ==="
          dig +short NS sahadhyayi.com
          echo "=== Apex A / AAAA ==="
          dig +short A sahadhyayi.com
          dig +short AAAA sahadhyayi.com
          echo "=== www CNAME / A ==="
          dig +short CNAME www.sahadhyayi.com
          dig +short A www.sahadhyayi.com
          for url in https://sahadhyayi.com/ https://www.sahadhyayi.com/ https://sahadhyayi.gyan-596.workers.dev/; do
            echo "=== HTTP headers: $url ==="
            curl -sSIL --max-time 12 "$url" | head -n 25
          done
          inspect_bundle() {
            local base_url="$1"
            local effective_url html_status asset asset_url bundle_status
            effective_url="$(curl -sSL --max-time 10 -o /tmp/sahadhyayi-page.html -w '%{url_effective}' "${base_url%/}/" || true)"
            html_status="$(curl -sSL --max-time 10 -o /dev/null -w '%{http_code}' "${base_url%/}/" || true)"
            echo "=== Bundle inspection: $base_url (effective: $effective_url, HTTP $html_status) ==="
            [[ -s /tmp/sahadhyayi-page.html ]] || { echo "No HTML body"; return; }
            local origin
            origin="$(echo "$effective_url" | grep -oE "^https?://[^/]+")"
            [[ -n "$origin" ]] || origin="${base_url%/}"
            grep -oE '(src|href)="[^"]+\.js[^"]*"' /tmp/sahadhyayi-page.html | cut -d '"' -f 2 | head -n 16 | while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              if [[ "$asset" == http* ]]; then asset_url="$asset"; else asset_url="${origin%/}$asset"; fi
              bundle_status="$(curl -sSL --max-time 10 -o /tmp/sahadhyayi-bundle.js -w '%{http_code}' "$asset_url" || true)"
              if grep -Fq "$EXPECTED_SUPABASE_URL" /tmp/sahadhyayi-bundle.js 2>/dev/null; then
                echo "Asset $asset_url: HTTP $bundle_status; production Supabase URL present"
              else
                echo "Asset $asset_url: HTTP $bundle_status; production Supabase URL absent"
              fi
            done
          }
          inspect_bundle https://sahadhyayi.gyan-596.workers.dev
          inspect_bundle https://www.sahadhyayi.com

  verify-production-domain:
    name: Verify Worker and production custom domains
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for Cloudflare rollout and verify consistent entry bundles
        env:
          EXPECTED_SUPABASE_URL: https://rknxtatvlzunatpyqxro.supabase.co
        shell: bash
        run: |
          set -euo pipefail

          # Capture each host from one HTML response through its exact module entry
          # script. Do not refetch the HTML in a second helper: cache/origin mixing
          # can otherwise let one old response pass alongside a newer response.
          capture_host() {
            local base_url="$1"
            local label="$2"
            local nonce request_url response effective_url origin html_file script_tag entry_asset entry_url bundle_file status normalized_path bundle_hash

            nonce="$(date +%s%N)-$RANDOM"
            request_url="${base_url%/}/?__production_smoke=${nonce}"
            html_file="/tmp/sahadhyayi-smoke-${label}.html"
            bundle_file="/tmp/sahadhyayi-smoke-${label}.js"

            response="$(curl -sSL --max-time 15 -H 'Cache-Control: no-cache' \
              -o "$html_file" -w '%{http_code}\t%{url_effective}' "$request_url" || true)"
            status="${response%%$'\t'*}"
            effective_url="${response#*$'\t'}"
            [[ "$status" == "200" && -s "$html_file" && "$effective_url" == http* ]] || {
              echo "Host $label: homepage unavailable (HTTP ${status:-unknown})." >&2
              return 1
            }

            origin="$(printf '%s' "$effective_url" | grep -oE '^https?://[^/]+' || true)"
            [[ -n "$origin" ]] || origin="${base_url%/}"
            script_tag="$(grep -oE '<script[^>]*>' "$html_file" | grep -E 'type=["']module["']' | head -n 1 || true)"
            entry_asset="$(printf '%s' "$script_tag" | grep -oE 'src=["'][^"']+\.js[^"']*["']' | head -n 1 | sed -E 's/^src=["'']//; s/["'']$//' || true)"
            [[ -n "$entry_asset" ]] || {
              echo "Host $label: no module entry script found in HTML from $effective_url." >&2
              return 1
            }

            case "$entry_asset" in
              http://*|https://*) entry_url="$entry_asset" ;;
              /*) entry_url="${origin%/}$entry_asset" ;;
              *) entry_url="${origin%/}/$entry_asset" ;;
            esac

            # Fetch the entry script named by this exact HTML response. The query
            # forces revalidation, while the hash gives us a byte-level comparison.
            status="$(curl -sSL --max-time 15 -H 'Cache-Control: no-cache' \
              -o "$bundle_file" -w '%{http_code}' "${entry_url}?__production_smoke=${nonce}" || true)"
            [[ "$status" == "200" && -s "$bundle_file" ]] || {
              echo "Host $label: module entry unavailable (HTTP ${status:-unknown}) at $entry_url." >&2
              return 1
            }
            if ! grep -Fq "$EXPECTED_SUPABASE_URL" "$bundle_file"; then
              echo "Host $label: expected Supabase project URL is absent from its own module entry $entry_asset." >&2
              return 1
            fi

            normalized_path="$(printf '%s' "$entry_asset" | sed -E 's#^https?://[^/]+##; s/[?].*$//')"
            bundle_hash="$(sha256sum "$bundle_file" | cut -d ' ' -f 1)"
            echo "Host $label: $normalized_path, sha256=$bundle_hash, Supabase config present." >&2
            printf '%s|%s\n' "$normalized_path" "$bundle_hash"
          }

          echo "Authoritative nameservers for sahadhyayi.com:"
          dig +short NS sahadhyayi.com || true
          echo "Apex A/AAAA answers:"
          dig +short A sahadhyayi.com || true
          dig +short AAAA sahadhyayi.com || true
          echo "www CNAME/A answers:"
          dig +short CNAME www.sahadhyayi.com || true
          dig +short A www.sahadhyayi.com || true

          worker_url="https://sahadhyayi.gyan-596.workers.dev"
          worker_snapshot=""
          apex_snapshot=""
          www_snapshot=""

          for attempt in {1..18}; do
            worker_snapshot="$(capture_host "$worker_url" worker || true)"
            apex_snapshot="$(capture_host "https://sahadhyayi.com" apex || true)"
            www_snapshot="$(capture_host "https://www.sahadhyayi.com" www || true)"

            echo "Attempt $attempt/18 deployment snapshots:"
            echo "  Worker: ${worker_snapshot:-UNAVAILABLE}"
            echo "  Apex:   ${apex_snapshot:-UNAVAILABLE}"
            echo "  www:    ${www_snapshot:-UNAVAILABLE}"

            if [[ -n "$worker_snapshot" &&
                  "$worker_snapshot" == "$apex_snapshot" &&
                  "$worker_snapshot" == "$www_snapshot" ]]; then
              echo "Worker and both production domains serve the same hashed JavaScript entry and expected Supabase project."
              exit 0
            fi

            echo "Hosts are unavailable or do not yet serve byte-identical entry bundles; waiting for rollout/cache convergence."
            sleep 10
          done

          echo "::error::Production hosts did not converge to the same JavaScript entry bundle."
          echo "::error::Worker: ${worker_snapshot:-UNAVAILABLE}"
          echo "::error::Apex:   ${apex_snapshot:-UNAVAILABLE}"
          echo "::error::www:    ${www_snapshot:-UNAVAILABLE}"
          exit 1
