name: Verify Cloudflare npm install compatibility

on:
  push:
    branches:
      - fix/cloudflare-npm-arborist-resolution-2026-11-01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Match Cloudflare npm version
        run: |
          npm install --global npm@10.9.2
          node --version
          npm --version
      - name: Regenerate lockfile from pinned dependency manifest
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel=verbose
        env:
          npm_config_fetch_retries: 2
      - name: Commit synchronized lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): synchronize npm lockfile"
            git push
          fi
      - name: Verify Cloudflare clean install
        run: npm ci --no-audit --no-fund
