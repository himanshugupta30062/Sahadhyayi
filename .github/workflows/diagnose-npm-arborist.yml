name: Diagnose npm Arborist resolution

on:
  push:
    branches:
      - fix/cloudflare-npm-arborist-resolution-2026-11-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate-overrides:
    name: npm 10.9.2 / ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - baseline
          - no-overrides
          - no-eslint-plugin-override
          - no-brace-expansion
          - no-tinypool
          - no-glob
          - no-postcss-selector-parser
          - no-form-data
          - no-lodash
          - no-flatted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Pin Cloudflare npm version
        run: npm install --global npm@10.9.2
      - name: Test dependency resolution with isolated manifest
        shell: bash
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/npm-case
          cp package.json /tmp/npm-case/package.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = '/tmp/npm-case/package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          const testCase = process.env.CASE;
          const removals = {
            'no-eslint-plugin-override': 'eslint-plugin-jsx-a11y',
            'no-brace-expansion': 'brace-expansion@^1.1.11',
            'no-tinypool': 'tinypool',
            'no-glob': 'glob',
            'no-postcss-selector-parser': 'postcss-selector-parser@6.0.10',
            'no-form-data': 'form-data',
            'no-lodash': 'lodash',
            'no-flatted': 'flatted'
          };
          if (testCase === 'no-overrides') delete pkg.overrides;
          else if (removals[testCase]) delete pkg.overrides[removals[testCase]];
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          cd /tmp/npm-case
          npm --version
          echo "Case: $CASE"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel=verbose >install.log 2>&1
          status=$?
          tail -n 35 install.log || true
          if [ "$status" -ne 0 ]; then
            echo "::error::npm dependency resolution failed for $CASE (exit $status)"
            latest_log="$(ls -t "$HOME"/.npm/_logs/*debug-0.log 2>/dev/null | head -n 1)"
            if [ -n "$latest_log" ]; then
              echo "----- npm debug stack ($latest_log) -----"
              tail -n 100 "$latest_log"
            fi
            exit "$status"
          fi
          echo "Dependency resolution succeeded for $CASE"
