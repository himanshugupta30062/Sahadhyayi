name: Production startup smoke test

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/production-startup-smoke.mjs"
      - ".github/workflows/production-startup-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/production-startup-smoke.mjs"
      - ".github/workflows/production-startup-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-startup:
    name: Build and verify browser startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Install pinned Playwright without lifecycle scripts
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sahadhyayi-preview.log 2>&1 &
          echo $! > /tmp/sahadhyayi-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Production preview is responding."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sahadhyayi-preview.log
          echo "::error::Production preview did not become ready."
          exit 1

      - name: Verify React initializes in a real browser
        run: node scripts/production-startup-smoke.mjs

      - name: Print preview logs on failure
        if: failure()
        run: cat /tmp/sahadhyayi-preview.log || true

      - name: Stop production preview
        if: always()
        run: |
          if [ -f /tmp/sahadhyayi-preview.pid ]; then
            kill "$(cat /tmp/sahadhyayi-preview.pid)" 2>/dev/null || true
          fi
