name: Security dependency remediation

on:
  push:
    branches:
      - security/dependency-remediation-nov-2026
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: security-dependency-remediation
  cancel-in-progress: false

jobs:
  lockfile-and-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile safely
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(security): regenerate dependency lockfile"
            git push
          fi

      - name: Install exact lockfile
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
