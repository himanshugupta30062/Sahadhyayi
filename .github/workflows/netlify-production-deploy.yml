name: Deploy production site to Netlify

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and publish production site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build production bundle
        run: npm run build

      - name: Verify deployable bundle and Supabase target
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -Eq 'src="/assets/[^"]+\.js"' dist/index.html
          if ! grep -Fq 'https://rknxtatvlzunatpyqxro.supabase.co' dist/assets/*.js; then
            echo "::error::Production Supabase URL is missing from the built JavaScript."
            exit 1
          fi
          echo "Production HTML, JavaScript entry, and Supabase target verified."

      - name: Publish to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NETLIFY_AUTH_TOKEN}" || -z "${NETLIFY_SITE_ID}" ]]; then
            echo "::error::Configure NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in GitHub Actions repository secrets."
            exit 1
          fi
          npx --yes netlify-cli@23.11.0 deploy --prod --dir=dist --site="${NETLIFY_SITE_ID}"