name: Repair PR npm lockfile

on:
  push:
    branches:
      - fix/sonar-reliability-remediation

permissions:
  contents: write

concurrency:
  group: repair-npm-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.head_commit.message != 'chore: synchronize npm lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package and lockfile root metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies', 'overrides']) {
            const expected = pkg[section] ?? {};
            const actual = root?.[section] ?? {};
            if (JSON.stringify(expected, Object.keys(expected).sort()) !== JSON.stringify(actual, Object.keys(actual).sort())) {
              throw new Error(`package-lock root ${section} does not match package.json`);
            }
          }
          console.log('package.json and package-lock.json root metadata are synchronized.');
          NODE
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin HEAD:${{ github.ref_name }}
