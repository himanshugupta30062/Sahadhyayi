sonar.projectKey=sahadhyayi
sonar.projectName=Sahadhyayi
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.exclusions=node_modules/**,dist/**,public/**,src/__tests__/**
sonar.python.version=3.12
# Keep test code out of coverage denominators; tests should exercise production files, not be measured as production code.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Avoid counting immutable migration history and generated Supabase type snapshots
# as maintainable source duplication. These files remain available to source analysis.
sonar.cpd.exclusions=**/supabase/migrations/**,**/src/integrations/supabase/types.ts,**/archive/**

# Sahadhyayi uses Supabase/PostgreSQL, not Oracle PL/SQL. The PL/SQL analyzer's
# Data Dictionary warning is not applicable to these PostgreSQL migration files.
# Keep migrations included in normal source analysis; ignore only Oracle-specific
# PL/SQL rules whose checks require an Oracle data dictionary.
sonar.issue.ignore.multicriteria=plsql_dict_s3641,plsql_dict_s3921,plsql_dict_s3651,plsql_dict_s3618
sonar.issue.ignore.multicriteria.plsql_dict_s3641.ruleKey=plsql:S3641
sonar.issue.ignore.multicriteria.plsql_dict_s3641.resourceKey=**/supabase/migrations/**/*.sql
sonar.issue.ignore.multicriteria.plsql_dict_s3921.ruleKey=plsql:S3921
sonar.issue.ignore.multicriteria.plsql_dict_s3921.resourceKey=**/supabase/migrations/**/*.sql
sonar.issue.ignore.multicriteria.plsql_dict_s3651.ruleKey=plsql:S3651
sonar.issue.ignore.multicriteria.plsql_dict_s3651.resourceKey=**/supabase/migrations/**/*.sql
sonar.issue.ignore.multicriteria.plsql_dict_s3618.ruleKey=plsql:S3618
sonar.issue.ignore.multicriteria.plsql_dict_s3618.resourceKey=**/supabase/migrations/**/*.sql
